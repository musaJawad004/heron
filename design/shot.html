<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { display:grid; place-items:center; overflow:hidden; width:100vw; height:100vh;
         background:
           radial-gradient(90% 70% at 15% 5%, #2a5570 0%, rgba(42,85,112,0) 55%),
           radial-gradient(80% 70% at 88% 90%, #1d6b6b 0%, rgba(29,107,107,0) 55%),
           linear-gradient(150deg, #16303f 0%, #0b1620 100%); }
  /* The windows are transparent and normally sit on a native material, so a
     backdrop stands in for the desktop behind them. */
  iframe { border:0; background:transparent; border-radius:12px;
           box-shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3); }
</style></head>
<body><iframe id="f"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.style.width = q.get('w') + 'px';
  f.style.height = q.get('h') + 'px';
  f.src = 'http://localhost:1420' + q.get('route');
</script></body></html>
