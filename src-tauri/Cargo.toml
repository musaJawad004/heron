[package]
name = "heron"
version = "0.1.0"
description = "Watches your Claude Code sessions from the menu bar / tray. Local only."
authors = ["Glixen Technologies <contact@glixentech.com>"]
license = "MIT"
repository = "https://github.com/glixentech/heron"
edition = "2021"
rust-version = "1.85"

[lib]
name = "heron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
dirs = "6"
notify = "8"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
parking_lot = "0.12"
# Tray icon composition (count badge / attention dot). PNG only; no network.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Panel window level / collection behaviour (above full-screen apps). Already in
# the tree through tauri; we enable only the NSWindow surface.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
